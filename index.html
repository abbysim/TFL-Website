<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tech Futures Lab — Mockup Comparison</title>
<style>
  html,body{margin:0; padding:0; height:100%; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; overflow:hidden;}
  .toggle-bar{
    height:56px; background:#16224D; display:flex; align-items:center; justify-content:center;
    gap:10px; border-bottom:1px solid #3B4A86; position:relative; z-index:10;
  }
  .toggle-bar .label{
    color:#C4CCE6; font-size:12px; letter-spacing:.08em; text-transform:uppercase; margin-right:14px;
  }
  .toggle-btn{
    padding:9px 20px; border-radius:100px; border:1px solid #3B4A86; background:transparent;
    color:#C4CCE6; font-size:13px; font-weight:600; cursor:pointer; transition:all .2s;
  }
  .toggle-btn:hover{border-color:#98002E; color:#fff;}
  .toggle-btn.active-a{background:linear-gradient(135deg,#98002E,#6E0020); color:#fff; border-color:transparent;}
  .toggle-btn.active-b{background:#8C1515; color:#fff; border-color:transparent;}
  .toggle-btn.active-c{background:#2FB6E0; color:#041B2B; border-color:transparent;}
  .frame-wrap{position:relative; width:100%; height:calc(100% - 56px);}
  iframe{
    position:absolute; top:0; left:0; width:100%; height:100%; border:none; background:#fff;
  }
  #frame-hoover, #frame-navy{display:none;}
</style>
</head>
<body>

<div class="toggle-bar">
  <span class="label">View:</span>
  <button id="btn-futuristic" class="toggle-btn active-a">Futuristic / Signal Concept</button>
  <button id="btn-hoover" class="toggle-btn">Hoover Brand-Aligned</button>
  <button id="btn-navy" class="toggle-btn">Navy / Globe Concept</button>
</div>

<div class="frame-wrap">
  <iframe id="frame-futuristic"></iframe>
  <iframe id="frame-hoover"></iframe>
  <iframe id="frame-navy"></iframe>
</div>

<script>
  const FUTURISTIC_HTML = "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>Tech Futures Lab \u2014 Hoover Institution</title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap\" rel=\"stylesheet\">\n<style>\n  :root{\n    --bg:#F6F7FA;\n    --surface:#FFFFFF;\n    --surface-2:#EDEFF4;\n    --border:#DBDFE7;\n    --text:#0E1730;\n    --text-dim:#4B5470;\n    --text-faint:#7B8399;\n    --teal:#98002E;\n    --amber:#887E6F;\n    --violet:#A7A9AC;\n    --teal-glow: rgba(152,0,46,.16);\n    --amber-glow: rgba(136,126,111,.14);\n    --violet-glow: rgba(167,169,172,.18);\n\n    --navy-bg:#16224D;\n    --navy-surface:#1B2A5C;\n    --navy-surface-2:#233872;\n    --navy-border:#3B4A86;\n    --navy-text:#FFFFFF;\n    --navy-text-dim:#C4CCE6;\n    --navy-text-faint:#98A3C9;\n  }\n  *{box-sizing:border-box; margin:0; padding:0;}\n  html{scroll-behavior:smooth;}\n  body{\n    background:var(--bg);\n    color:var(--text);\n    font-family:'Inter',sans-serif;\n    line-height:1.5;\n    -webkit-font-smoothing:antialiased;\n    overflow-x:hidden;\n  }\n  h1,h2,h3,.display{font-family:'Space Grotesk',sans-serif;}\n  .mono{font-family:'JetBrains Mono',monospace;}\n  a{color:inherit; text-decoration:none;}\n  img{max-width:100%; display:block;}\n\n  /* background texture: faint scanline grid */\n  .grid-texture{\n    position:fixed; inset:0; pointer-events:none; z-index:0;\n    background-image:\n      linear-gradient(rgba(14,23,48,0.035) 1px, transparent 1px),\n      linear-gradient(90deg, rgba(14,23,48,0.035) 1px, transparent 1px);\n    background-size: 42px 42px;\n    mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, black 40%, transparent 90%);\n  }\n\n  .wrap{max-width:1240px; margin:0 auto; padding:0 32px;}\n\n  /* ---------- NAV ---------- */\n  header{\n    position:sticky; top:0; z-index:50;\n    backdrop-filter: blur(14px);\n    background:rgba(238,241,248,0.86);\n    border-bottom:2px solid var(--navy-surface);\n  }\n  nav{\n    display:flex; align-items:center; justify-content:space-between;\n    max-width:1240px; margin:0 auto; padding:16px 32px;\n  }\n  .brand{display:flex; align-items:center; gap:14px;}\n  .mark{\n    width:46px; height:46px; position:relative; flex-shrink:0;\n  }\n  .mark svg{width:100%; height:100%;}\n  .brand-text{display:flex; flex-direction:column; line-height:1.2;}\n  .brand-text .b1{font-size:11px; letter-spacing:.14em; color:var(--text-dim); font-family:'JetBrains Mono',monospace; text-transform:uppercase;}\n  .brand-text .b2{font-size:23px; font-weight:700; font-family:'Space Grotesk',sans-serif; color:var(--text);}\n  .futures-part{\n    background:linear-gradient(90deg, #9FC2EE, #16264F);\n    -webkit-background-clip:text; background-clip:text; color:transparent;\n  }\n  .nav-links{display:flex; gap:34px; font-size:14px; color:var(--text-dim);}\n  .nav-links a{transition:color .2s;}\n  .nav-links a:hover{color:var(--teal);}\n  .nav-right{display:flex; align-items:center; gap:16px;}\n  .btn{\n    font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:.04em;\n    padding:9px 16px; border-radius:6px; border:1px solid var(--border);\n    display:inline-flex; align-items:center; gap:8px; cursor:pointer;\n    transition:all .2s; white-space:nowrap;\n  }\n  .btn-ghost{color:var(--text-dim); background:transparent;}\n  .btn-ghost:hover{border-color:var(--teal); color:var(--teal);}\n  .btn-solid{\n    background:linear-gradient(135deg, var(--teal), #6E0020);\n    color:#FFFFFF; font-weight:600; border:none;\n  }\n  .btn-solid:hover{box-shadow:0 0 24px var(--teal-glow);}\n\n  /* ---------- HERO ---------- */\n  .hero{position:relative; padding:96px 0 80px; overflow:hidden;}\n  .hero-wrap{display:flex; align-items:center; gap:36px;}\n  .hero-inner{position:relative; z-index:2; flex:0 1 480px; min-width:0;}\n  .eyebrow{\n    font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:.16em;\n    color:var(--teal); text-transform:uppercase; display:flex; align-items:center; gap:10px; margin-bottom:22px;\n  }\n  .eyebrow::before{content:''; width:22px; height:1px; background:var(--teal);}\n  .hero h1{\n    font-size:52px; font-weight:700; line-height:1.08; letter-spacing:-.02em;\n    margin-bottom:22px;\n  }\n  .hero h1 span{\n    background:linear-gradient(90deg, var(--teal), #384062);\n    -webkit-background-clip:text; background-clip:text; color:transparent;\n  }\n  .hero p{font-size:17px; color:var(--text-dim); max-width:480px; margin-bottom:34px;}\n  .hero-ctas{display:flex; gap:14px;}\n\n  /* Cone of Plausibility - signature visual */\n  .cone-stage{\n    position:relative; flex:1 1 480px; min-width:0; height:520px;\n    z-index:1; opacity:1;\n  }\n  .cone-svg{width:100%; height:100%;}\n  .cone-band{transition:opacity .3s;}\n  .today-line{stroke:var(--navy-surface); stroke-width:1.4; stroke-dasharray:3 5;}\n  .cone-dot{filter:drop-shadow(0 0 8px currentColor);}\n  @keyframes sweep{\n    0%{transform:translateX(0); opacity:0;}\n    8%{opacity:.65;}\n    90%{opacity:.2;}\n    100%{transform:translateX(560px); opacity:0;}\n  }\n  .sweep-line{animation:sweep 5.5s linear infinite;}\n  @keyframes pulse{\n    0%,100%{opacity:.65; r:4;}\n    50%{opacity:1; r:5.6;}\n  }\n  .pulse{animation:pulse 2.6s ease-in-out infinite;}\n\n  .cone-labels{\n    position:absolute; bottom:6%; right:4%; display:flex; gap:26px;\n    z-index:2; font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:600;\n  }\n  .cone-label{display:flex; align-items:center; gap:7px; color:var(--text);}\n  .cone-label .sw{width:9px; height:9px; border-radius:2px;}\n\n  @media(max-width:900px){\n    .hero-wrap{flex-wrap:wrap;}\n    .cone-stage{display:none;}\n    .hero h1{font-size:42px;}\n  }\n\n  /* ---------- SECTION HEADERS ---------- */\n  .section{padding:64px 0;}\n  .section-navy-tint{\n    background:linear-gradient(180deg, #EEF1F9, #F6F7FA 85%);\n    border-top:1px solid #E1E6F2; border-bottom:1px solid #E1E6F2;\n  }\n  .section-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:30px; flex-wrap:wrap; gap:16px;}\n  .section-title{font-size:26px; font-weight:600;}\n  .section-sub{font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.14em; color:var(--navy-surface-2); text-transform:uppercase; margin-bottom:6px; font-weight:600;}\n\n  /* ---------- FILTERS ---------- */\n  .filters{display:flex; flex-direction:column; gap:14px; margin-bottom:32px;}\n  .filter-row{display:flex; align-items:center; gap:12px; flex-wrap:wrap;}\n  .filter-label{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--text-faint); width:96px; text-transform:uppercase; letter-spacing:.08em;}\n  .chip{\n    font-size:13px; padding:7px 14px; border-radius:100px; border:1px solid #C7CEE3;\n    color:var(--text-dim); cursor:pointer; transition:all .2s; background:transparent;\n  }\n  .chip:hover{border-color:var(--navy-surface); color:var(--navy-surface);}\n  .chip.active{background:var(--surface-2); border-color:var(--teal); color:var(--teal);}\n\n  /* ---------- MAIN GRID LAYOUT ---------- */\n  .content-grid{display:grid; grid-template-columns:1fr 340px; gap:40px; align-items:start;}\n  @media(max-width:960px){.content-grid{grid-template-columns:1fr;}}\n\n  .card-grid{display:grid; grid-template-columns:1fr 1fr; gap:20px;}\n  @media(max-width:640px){.card-grid{grid-template-columns:1fr;}}\n\n  .card{\n    background:var(--surface); border:1px solid var(--border); border-radius:12px;\n    padding:22px; position:relative; overflow:hidden; cursor:pointer;\n    transition:transform .25s, border-color .25s, box-shadow .25s;\n  }\n  .card::before{\n    content:''; position:absolute; top:0; left:0; right:0; height:2px;\n  }\n  .card.type-whatif::before{background:var(--teal);}\n  .card.type-assumptions::before{background:var(--amber);}\n  .card.type-counterpoint::before{background:var(--violet);}\n  .card:hover{transform:translateY(-3px); border-color:var(--text-faint);}\n  .card.type-whatif:hover{box-shadow:0 14px 34px -12px var(--teal-glow);}\n  .card.type-assumptions:hover{box-shadow:0 14px 34px -12px var(--amber-glow);}\n  .card.type-counterpoint:hover{box-shadow:0 14px 34px -12px var(--violet-glow);}\n\n  .card-tag{\n    font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.1em; text-transform:uppercase;\n    display:flex; align-items:center; gap:6px; margin-bottom:14px;\n  }\n  .card-tag.tw{color:var(--teal);}\n  .card-tag.ta{color:var(--amber);}\n  .card-tag.tc{color:var(--violet);}\n  .card-tag .dot{width:6px; height:6px; border-radius:50%; background:currentColor;}\n\n  .card h3{font-size:18px; font-weight:600; margin-bottom:10px; line-height:1.3;}\n  .card p{font-size:13.5px; color:var(--text-dim); margin-bottom:18px;}\n  .card-meta{display:flex; justify-content:space-between; align-items:center; font-size:11px; color:var(--text-faint);}\n  .card-meta-tags{display:flex; gap:6px;}\n  .meta-pill{border:1px solid var(--border); padding:3px 8px; border-radius:100px; font-family:'JetBrains Mono',monospace;}\n\n  .view-all{\n    display:inline-flex; align-items:center; gap:8px; margin-top:28px;\n    font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--teal); cursor:pointer;\n  }\n\n  /* ---------- SIDEBAR WIDGETS ---------- */\n  .widget{\n    background:var(--surface); border:1px solid var(--border); border-radius:12px;\n    padding:24px; margin-bottom:22px;\n  }\n  .widget-title{font-size:15px; font-weight:600; margin-bottom:4px;}\n  .widget-q{font-size:13.5px; color:var(--text-dim); margin-bottom:18px;}\n\n  .poll-row{margin-bottom:12px;}\n  .poll-label{display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:6px;}\n  .poll-label .pct{font-family:'JetBrains Mono',monospace; color:var(--teal);}\n  .poll-track{height:6px; background:var(--surface-2); border-radius:100px; overflow:hidden;}\n  .poll-fill{height:100%; background:linear-gradient(90deg, var(--teal), var(--violet)); border-radius:100px;}\n  .poll-footer{display:flex; justify-content:space-between; font-size:11px; color:var(--text-faint); margin-top:16px; font-family:'JetBrains Mono',monospace;}\n\n  .submit-card{\n    background:linear-gradient(160deg, var(--surface-2), var(--surface));\n    border:1px solid var(--border); border-radius:12px; padding:24px; margin-bottom:22px;\n  }\n  .submit-card p{font-size:13px; color:var(--text-dim); margin:10px 0 16px;}\n  .submit-btn{\n    width:100%; text-align:center; justify-content:center;\n    background:transparent; border:1px solid var(--teal); color:var(--teal);\n  }\n  .submit-btn:hover{background:var(--teal); color:#FFFFFF;}\n\n  /* radar chart */\n  .radar-wrap{display:flex; flex-direction:column; align-items:center;}\n  .radar-legend{display:flex; gap:14px; flex-wrap:wrap; justify-content:center; margin-top:14px; font-size:10.5px; font-family:'JetBrains Mono',monospace; color:var(--text-dim);}\n  .radar-legend span{display:flex; align-items:center; gap:5px;}\n  .radar-legend i{width:7px; height:7px; border-radius:50%; display:inline-block;}\n\n  .news-item{display:flex; gap:12px; padding:12px 0; border-bottom:1px solid var(--border);}\n  .news-item:last-child{border-bottom:none; padding-bottom:0;}\n  .news-thumb{width:52px; height:52px; border-radius:8px; flex-shrink:0; background:linear-gradient(135deg, var(--surface-2), var(--border));}\n  .news-title{font-size:12.5px; font-weight:500; line-height:1.35;}\n  .news-time{font-size:10.5px; color:var(--text-faint); font-family:'JetBrains Mono',monospace; margin-top:4px;}\n\n  /* ---------- FELLOWS + EVENTS SPLIT ---------- */\n  .split-grid{display:grid; grid-template-columns:1fr 1fr; gap:56px;}\n  @media(max-width:800px){.split-grid{grid-template-columns:1fr; gap:44px;}}\n  .fellows-grid-v{display:flex; flex-direction:column; gap:14px;}\n  .fellow-card{\n    background:var(--surface); border:1px solid var(--navy-border); border-radius:12px; padding:22px;\n    display:flex; gap:16px; align-items:center; border-left:3px solid var(--navy-surface);\n  }\n  .avatar{\n    width:56px; height:56px; border-radius:50%; flex-shrink:0;\n    display:flex; align-items:center; justify-content:center;\n    font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:16px;\n    color:#FFFFFF;\n  }\n  .a1{background:linear-gradient(135deg, var(--teal), #6E0020);}\n  .a2{background:linear-gradient(135deg, var(--amber), #6B6255);}\n  .a3{background:linear-gradient(135deg, var(--violet), #777575);}\n  .fellow-name{font-size:15px; font-weight:600;}\n  .fellow-role{font-size:12px; color:var(--text-dim); margin-top:2px;}\n\n  /* ---------- EVENTS ---------- */\n  .events-list{display:flex; flex-direction:column; gap:2px;}\n  .event-row{\n    display:flex; gap:20px; align-items:center; padding:18px 0; border-bottom:1px solid var(--navy-border);\n  }\n  .event-date{\n    width:56px; height:56px; border-radius:10px; background:var(--navy-bg); border:1px solid var(--navy-border);\n    display:flex; flex-direction:column; align-items:center; justify-content:center; flex-shrink:0;\n  }\n  .event-date .m{font-family:'JetBrains Mono',monospace; font-size:9.5px; color:#9FC2EE; letter-spacing:.06em;}\n  .event-date .d{font-family:'Space Grotesk',sans-serif; font-size:19px; font-weight:600; color:#FFFFFF;}\n  .event-title{font-size:14.5px; font-weight:600;}\n  .event-meta{font-size:12px; color:var(--text-dim); margin-top:3px;}\n\n  /* ---------- FOOTER ---------- */\n  footer{\n    --bg:var(--navy-bg);\n    --surface:var(--navy-surface);\n    --surface-2:var(--navy-surface-2);\n    --border:var(--navy-border);\n    --text:var(--navy-text);\n    --text-dim:var(--navy-text-dim);\n    --text-faint:var(--navy-text-faint);\n    background:var(--bg); color:var(--text); margin-top:40px;\n    border-top:3px solid transparent;\n    border-image:linear-gradient(90deg, #98002E, #9FC2EE, #16264F) 1;\n  }\n  .newsletter-bar{\n    background:linear-gradient(120deg, #233872, #16224D 70%);\n    padding:38px 0; border-bottom:1px solid var(--border);\n  }\n  .newsletter-inner{display:flex; align-items:center; justify-content:space-between; gap:24px; flex-wrap:wrap;}\n  .newsletter-inner h3{font-size:19px; margin-bottom:4px;}\n  .newsletter-inner p{font-size:13px; color:var(--text-dim);}\n  .newsletter-form{display:flex; gap:10px; flex-wrap:wrap;}\n  .newsletter-form input{\n    background:var(--navy-bg); border:1px solid var(--border); border-radius:6px; padding:11px 14px;\n    color:var(--text); font-size:13px; min-width:240px; font-family:'Inter',sans-serif;\n  }\n  .newsletter-form input::placeholder{color:var(--text-faint);}\n  .newsletter-form input:focus{outline:2px solid #9FC2EE; outline-offset:1px;}\n\n  .footer-main{padding:52px 0 30px;}\n  .footer-grid{display:grid; grid-template-columns:1.6fr repeat(4,1fr); gap:32px;}\n  @media(max-width:800px){.footer-grid{grid-template-columns:1fr 1fr;}}\n  .footer-col h4{font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--text-faint); margin-bottom:16px;}\n  .footer-col a{display:block; font-size:13px; color:var(--text-dim); margin-bottom:11px; transition:color .2s;}\n  .footer-col a:hover{color:var(--teal);}\n  .footer-bottom{\n    display:flex; justify-content:space-between; padding-top:28px; border-top:1px solid var(--border);\n    font-size:12px; color:var(--text-faint); flex-wrap:wrap; gap:12px;\n  }\n\n  ::selection{background:var(--teal); color:#FFFFFF;}\n\n  @media (prefers-reduced-motion: reduce){\n    .sweep-line, .pulse{animation:none !important;}\n  }\n</style>\n</head>\n<body>\n\n<div class=\"grid-texture\"></div>\n\n<header>\n  <nav>\n    <div class=\"brand\">\n      <div class=\"mark\">\n        <svg viewBox=\"0 0 30 30\" fill=\"none\">\n          <defs>\n            <linearGradient id=\"tflMarkGrad\" x1=\"2\" y1=\"2\" x2=\"26\" y2=\"26\" gradientUnits=\"userSpaceOnUse\">\n              <stop offset=\"0\" stop-color=\"#B7D2F2\"/>\n              <stop offset=\"1\" stop-color=\"#16264F\"/>\n            </linearGradient>\n          </defs>\n          <circle cx=\"12.5\" cy=\"12.5\" r=\"8.5\" stroke=\"url(#tflMarkGrad)\" stroke-width=\"2.6\"/>\n          <line x1=\"18.5\" y1=\"18.5\" x2=\"26\" y2=\"26\" stroke=\"url(#tflMarkGrad)\" stroke-width=\"2.8\" stroke-linecap=\"round\"/>\n        </svg>\n      </div>\n      <div class=\"brand-text\">\n        <span class=\"b1\">Hoover Institution</span>\n        <span class=\"b2\">Tech <span class=\"futures-part\">Futures</span> Lab</span>\n      </div>\n    </div>\n    <div class=\"nav-links\">\n      <a href=\"#\">About</a>\n      <a href=\"#research\">Research</a>\n      <a href=\"#people\">People</a>\n      <a href=\"#events\">Events</a>\n      <a href=\"#\">News</a>\n    </div>\n    <div class=\"nav-right\">\n      <a href=\"#\" class=\"btn btn-ghost\">\u25ce Search</a>\n      <a href=\"#\" class=\"btn btn-solid\">Stay Up to Date</a>\n    </div>\n  </nav>\n</header>\n\n<!-- HERO -->\n<section class=\"hero\">\n  <div class=\"wrap hero-wrap\">\n    <div class=\"hero-inner\">\n      <div class=\"eyebrow\">Strategic Technological Surprise</div>\n      <h1>Mapping the <span>cone of&nbsp;plausibility</span> before it becomes headline news.</h1>\n      <p>The Tech Futures Lab explores how emerging technologies could transform the world in unexpected ways \u2014 through scenario development, wargaming, and speculative research built with public and private sector leaders.</p>\n      <div class=\"hero-ctas\">\n        <a href=\"#research\" class=\"btn btn-solid\" style=\"padding:13px 22px;\">Explore Research \u2192</a>\n        <a href=\"#\" class=\"btn btn-ghost\" style=\"padding:13px 22px; \"filter-label\">Format</span>\n        <span class=\"chip\" style=\"border-color:var(--teal); color:var(--teal);\">What If?</span>\n        <span class=\"chip\" style=\"border-color:var(--amber); color:var(--amber);\">Challenging Assumptions</span>\n        <span class=\"chip\" style=\"border-color:var(--violet); color:var(--violet);\">Counterpoint</span>\n      </div>\n    </div>\n\n    <div class=\"content-grid\">\n      <!-- CARDS -->\n      <div>\n        <div class=\"card-grid\">\n\n          <div class=\"card type-whatif\">\n            <div class=\"card-tag tw\"><span class=\"dot\"></span>What If?</div>\n            <h3>What if sensing outpaces computing as quantum's first surprise?</h3>\n            <p>Commercial gravimetric sensors were built for mining. They may quietly erode decades of assumptions about what stays hidden underwater.</p>\n            <div class=\"card-meta\">\n              <div class=\"card-meta-tags\"><span class=\"meta-pill\">Quantum</span><span class=\"meta-pill\">Defense</span></div>\n              <span>12 min read</span>\n            </div>\n          </div>\n\n          <div class=\"card type-assumptions\">\n            <div class=\"card-tag ta\"><span class=\"dot\"></span>Challenging Assumptions</div>\n            <h3>The chokepoint after the chokepoint</h3>\n            <p>Every supply-chain fix relocates risk one stage downstream. Mineral processing, not mining, may be the real bottleneck nobody is tracking.</p>\n            <div class=\"card-meta\">\n              <div class=\"card-meta-tags\"><span class=\"meta-pill\">Materials</span><span class=\"meta-pill\">Trade</span></div>\n              <span>10 min read</span>\n            </div>\n          </div>\n\n          <div class=\"card type-counterpoint\">\n            <div class=\"card-tag tc\"><span class=\"dot\"></span>Counterpoint</div>\n            <h3>Diffusion, not frontier capability, wins the AI era</h3>\n            <p>A counterpoint to the \"whoever's first dominates everything\" thesis \u2014 durable advantage may live in adoption, not benchmark scores.</p>\n            <div class=\"card-meta\">\n              <div class=\"card-meta-tags\"><span class=\"meta-pill\">AI</span><span class=\"meta-pill\">Economics</span></div>\n              <span>14 min read</span>\n            </div>\n          </div>\n\n          <div class=\"card type-whatif\">\n            <div class=\"card-tag tw\"><span class=\"dot\"></span>What If?</div>\n            <h3>What if the ocean became an autonomous ecosystem?</h3>\n            <p>Proliferating commercial underwater drones raise a quiet question: who owns maritime domain awareness when nobody does?</p>\n            <div class=\"card-meta\">\n              <div class=\"card-meta-tags\"><span class=\"meta-pill\">Robotics</span><span class=\"meta-pill\">Geopolitics</span></div>\n              <span>9 min read</span>\n            </div>\n          </div>\n\n          <div class=\"card type-assumptions\">\n            <div class=\"card-tag ta\"><span class=\"dot\"></span>Challenging Assumptions</div>\n            <h3>Harvest now, decrypt later \u2014 the migration nobody finished</h3>\n            <p>Cryptographically relevant quantum computing doesn't need to arrive for the risk to already be live.</p>\n            <div class=\"card-meta\">\n              <div class=\"card-meta-tags\"><span class=\"meta-pill\">Cybersecurity</span><span class=\"meta-pill\">Finance</span></div>\n              <span>11 min read</span>\n            </div>\n          </div>\n\n          <div class=\"card type-counterpoint\">\n            <div class=\"card-tag tc\"><span class=\"dot\"></span>Counterpoint</div>\n            <h3>Private infrastructure isn't quietly replacing the state</h3>\n            <p>A skeptical read on \"corporate sovereignty\" narratives \u2014 and where the evidence for state capacity actually holds up.</p>\n            <div class=\"card-meta\">\n              <div class=\"card-meta-tags\"><span class=\"meta-pill\">Governance</span><span class=\"meta-pill\">Policy</span></div>\n              <span>13 min read</span>\n            </div>\n          </div>\n\n        </div>\n        <a class=\"view-all\">View all research products \u2192</a>\n      </div>\n\n      <!-- SIDEBAR -->\n      <div>\n        <div class=\"widget\">\n          <div class=\"widget-title\">Prediction Check</div>\n          <div class=\"widget-q\">When will frontier AI models require national licensing in the U.S.?</div>\n\n          <div class=\"poll-row\">\n            <div class=\"poll-label\"><span>By 2026</span><span class=\"pct\">18%</span></div>\n            <div class=\"poll-track\"><div class=\"poll-fill\" style=\"width:18%\"></div></div>\n          </div>\n          <div class=\"poll-row\">\n            <div class=\"poll-label\"><span>2027\u20132028</span><span class=\"pct\">34%</span></div>\n            <div class=\"poll-track\"><div class=\"poll-fill\" style=\"width:34%\"></div></div>\n          </div>\n          <div class=\"poll-row\">\n            <div class=\"poll-label\"><span>2029\u20132030</span><span class=\"pct\">27%</span></div>\n            <div class=\"poll-track\"><div class=\"poll-fill\" style=\"width:27%\"></div></div>\n          </div>\n          <div class=\"poll-row\">\n            <div class=\"poll-label\"><span>After 2030</span><span class=\"pct\">13%</span></div>\n            <div class=\"poll-track\"><div class=\"poll-fill\" style=\"width:13%\"></div></div>\n          </div>\n          <div class=\"poll-row\">\n            <div class=\"poll-label\"><span>Never</span><span class=\"pct\">8%</span></div>\n            <div class=\"poll-track\"><div class=\"poll-fill\" style=\"width:8%\"></div></div>\n          </div>\n\n          <div class=\"poll-footer\"><span>2,847 votes</span><span>Updates daily</span></div>\n        </div>\n\n        <div class=\"submit-card\">\n          <div class=\"widget-title\">Submit a What If?</div>\n          <p>Suggest a question f   const HOOVER_HTML = "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>Tech Futures Lab | Hoover Institution</title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=PT+Serif:wght@700&family=Inter:wght@400;500;600;700&display=swap\" rel=\"stylesheet\">\n<style>\n  :root{\n    --red:#8C1515;\n    --red-dark:#6B0F10;\n    --black:#1A1A1A;\n    --gray:#4A4A4A;\n    --gray-light:#6E6E6E;\n    --line:#E2E0DC;\n    --bg:#FFFFFF;\n    --bg-alt:#F7F5F1;\n  }\n  *{box-sizing:border-box; margin:0; padding:0;}\n  body{\n    font-family:'Inter',Arial,sans-serif;\n    color:var(--black);\n    background:var(--bg);\n    line-height:1.55;\n  }\n  h1,h2,h3,h4{font-family:'Archivo',Arial,sans-serif; font-weight:700;}\n  .serif{font-family:'PT Serif', Georgia, serif;}\n  a{color:inherit; text-decoration:none;}\n  img{max-width:100%; display:block;}\n  .wrap{max-width:1180px; margin:0 auto; padding:0 32px;}\n  .eyebrow{\n    font-size:12px; font-weight:700; letter-spacing:.12em; text-transform:uppercase;\n    color:var(--red); margin-bottom:10px; display:block;\n  }\n  .btn{\n    display:inline-flex; align-items:center; gap:8px; padding:11px 24px;\n    font-size:13px; font-weight:600; letter-spacing:.03em; text-transform:uppercase;\n    border-radius:2px; cursor:pointer; transition:all .2s; border:1px solid transparent;\n  }\n  .btn-red{background:var(--red); color:#fff;}\n  .btn-red:hover{background:var(--red-dark);}\n  .btn-outline{border-color:var(--black); color:var(--black); background:transparent;}\n  .btn-outline:hover{background:var(--black); color:#fff;}\n  .btn-outline-white{border-color:#fff; color:#fff; background:transparent;}\n  .btn-outline-white:hover{background:#fff; color:var(--black);}\n\n  /* ---------- TOP UTILITY BAR ---------- */\n  .util-bar{background -card{cursor:pointer;}\n  .pub-thumb{\n    aspect-ratio:1/1; border-radius:4px; margin-bottom:14px; position:relative; overflow:hidden;\n    background-size:cover; background-position:center;\n    display:flex; align-items:flex-end; color:#fff;\n    font-family:'Archivo',sans-serif; font-weight:700; font-size:14px; padding:16px;\n  }\n  .pub-thumb::after{content:''; position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,.1), rgba(0,0,0,.68)); z-index:0;}\n  .pub-thumb span{position:relative; z-index:1;}\n  .pub-card h4{font-size:15px; font-weight:700; margin-bottom:6px;}\n  .pub-card .learn-more{font-size:12.5px; font-weight:700; color:var(--red);}\n\n  /* ---------- MULTIMEDIA / ARTICLE GRID ---------- */\n  .article-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:32px; margin-top:36px;}\n  @media(max-width:900px){.article-grid{grid-template-columns:1fr 1fr;}}\n  @media(max-width:640px){.article-grid{grid-template-columns:1fr;}}\n  .article-card{cursor:pointer;}\n  .article-thumb{\n    aspect-ratio:1/1; border-radius:4px; margin-bottom:14px; position:relative; overflow:hidden;\n    background-size:cover; background-position:center;\n    display:flex; align-items:flex-end; padding:14px; color:#fff;\n  }\n  .article-thumb::after{content:''; position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,0), rgba(0,0,0,.55)); z-index:0;}\n  .article-thumb span{\n    position:relative; z-index:1;\n    font-family:'Archivo',sans-serif; font-size:11px; font-weight:700; text-transform:uppercase;\n    letter-spacing:.08em; background:var(--red); padding:4px 8px; border-radius:2px;\n  }\n  .article-card h4{font-size:16px; font-weight:700; margin-bottom:8px; line-height:1.35;}\n  .article-card p{font-size:13.5px; color:var(--gray); margin-bottom:10px; line-height:1.6;}\n  .article-date{font-size:11px; font-weight:700; color:var(--red); text-transform:uppercase; letter-spacing:.06em;}\n\n  /* ---------- PREDICTION CHECK + SUBMIT WHAT I t:700; color:var(--red); letter-spacing:.06em;}\n  .event-date .d{font-family:'Archivo',sans-serif; font-size:21px; font-weight:700;}\n  .event-title{font-size:15.5px; font-weight:700;}\n  .event-meta{font-size:12.5px; color:var(--gray); margin-top:3px;}\n\n  /* ---------- FOOTER CTA BAND ---------- */\n  .cta-band{\n    background:linear-gradient(120deg, rgba(15,15,15,.82), rgba(15,15,15,.62)), url('https://commons.wikimedia.org/wiki/Special:FilePath/Stanford_campus_from_Hoover_Tower_12.JPG?width=1600') center/cover;\n    padding:64px 0; text-align:center; color:#fff;\n  }\n  .cta-band h2{font-size:26px; font-weight:700; max-width:640px; margin:0 auto 22px;}\n\n  /* ---------- FOOTER ---------- */\n  footer{background:#141414; color:#B8B8B8; padding-top:56px;}\n  .footer-top{display:grid; grid-template-columns:1.4fr 1fr 1fr 1fr; gap:40px; padding-bottom:40px; border-bottom:1px solid #333;}\n  @media(max-width:800px){.footer-top{grid-template-columns:1fr 1fr;}}\n  .footer-top .logo-mark{border-color:#fff; color:#fff;}\n  .footer-top .logo-text .l2{color:#fff;}\n  .footer-blurb{font-size:12.5px; line-height:1.7; margin:16px 0 20px; max-width:280px;}\n  .social-row{display:flex; gap:12px;}\n  .social-row a{\n    width:32px; height:32px; border:1px solid #444; border-radius:50%;\n    display:flex; align-items:center; justify-content:center; font-size:13px; color:#fff;\n  }\n  .footer-col h5{font-size:11.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:#888; margin-bottom:16px;}\n  .footer-col a{display:block; font-size:13px; margin-bottom:11px; transition:color .2s;}\n  .footer-col a:hover{color:#fff;}\n  .footer-bottom{\n    display:flex; justify-content:space-between; align-items:center; padding:24px 32px;\n    max-width:1180px; margin:0 auto; font-size:11.5px; flex-wrap:wrap; gap:10px;\n  }\n  .footer-bottom-inner{border-top:1px solid #333; margin-top:32px;}\n</style>\n</head>\n<body>\n\n<!-- UTILITY BAR -->\n<div class=\"util-bar\">\n  <div class=\"wrap\">\n    <a href=\"#\">Stanford University</a>\n    <a href=\"#\">Give Now</a>\n  </div>\n</div>\n\n<!-- MAIN NAV -->\n<header>\n  <nav>\n    <div class=\"logo\">\n      <div class=\"logo-mark\">H</div>\n      <div class=\"logo-text\">\n        <div class=\"l1\">Hoover Institution</div>\n        <div class=\"l2\">Tech Futures Lab</div>\n      </div>\n    </div>\n    <div class=\"nav-links\">\n      <a href=\"#\">About Hoover</a>\n      <a href=\"#\">Research</a>\n      <a href=\"#\">Commentary</a>\n      <a href=\"#\">Fellows</a>\n      <a href=\"#\">Library &amp; Archives</a>\n      <a href=\"#\">Support Hoover</a>\n    </div>\n    <div class=\"nav-right\">\n      <span class=\"icon-btn\">\ud83d\udd0d</span>\n      <a href=\"#\" class=\"btn btn-outline\" style=\"padding:9px 18px;\">MyHoover</a>\n    </div>\n  </nav>\n</header>\n\n<!-- HERO -->\n<div class=\"hero\">\n  <div class=\"hero-inner\">\n    <span class=\"eyebrow\" style=\"color:#fff;\">Research Initiative</span>\n    <h1>Tech Futures Lab</h1>\n    <a href=\"#\" class=\"btn btn-red\">Subscribe</a>\n  </div>\n</div>\n\n<!-- SUB NAV -->\n<div class=\"subnav\">\n  <div class=\"wrap\">\n    <a href=\"#\" class=\"active\">Home</a>\n    <a href=\"#\">About</a>\n    <a href=\"#\">Impact</a>\n    <a href=\"#\">People</a>\n    <a href=\"#\">Publications</a>\n    <a href=\"#\">Multimedia</a>\n    <a href=\"#\">Events</a>\n  </div>\n</div>\n\n<!-- INTRO + RESEARCH PRODUCTS -->\n<section class=\"section\">\n  <div class=\"wrap\">\n    <p class=\"intro-text\">\n      Emerging technologies are transforming the world in unexpected ways \u2014 often before governments, markets, or societies are prepared to respond. The Tech Futures Lab exists to anticipate strategic technological surprise: through scenario development, wargaming, and speculative research conducted with both public- and private-sector leaders. Modeled on the Lab structure pioneered elsewhere at Hoover, the team sponsors original research, convenes senior decision-makers, and publishes contrarian, evidence-grounded perspectives on where technology is headed next. <a href=\"#\">Read more.</a>\n    </p>\n\n    <span class=\"eyebrow\" style=\"margin-top:44px; display:block;\">Publications</span>\n    <div class=\"section-head\" style=\"margin-bottom:0;\">\n      <h2>Research Products</h2>\n      <p>Browse the Lab's essays, briefs, and speculative research by theme, technology, and format.</p>\n    </div>\n\n    <div class=\"filters\">\n      <div class=\"filter-row\" data-group=\"theme\">\n        <span class=\"filter-label\">Themes</span>\n        <span class=\"chip\" data-value=\"Geopolitics\">Geopolitics</span>\n        <span class=\"chip\" data-value=\"Education\">Education</span>\n        <span class=\"chip\" data-value=\"Society\">Society</span>\n        <span class=\"chip\" data-value=\"Governance\">Governance</span>\n        <span class=\"chip\" data-value=\"Economics\">Economics</span>\n      </div>\n      <div class=\"filter-row\" data-group=\"topic\">\n        <span class=\"filter-label\">Tech Topics</span>\n        <span class=\"chip active\" data-value=\"All\">All</span>\n        <span class=\"chip\" data-value=\"AI\">AI</span>\n        <span class=\"chip\" data-value=\"Biotech\">Biotech</span>\n        <span class=\"chip\" data-value=\"Crypto\">Crypto</span>\n        <span class=\"chip\" data-value=\"Energy\">Energy</span>\n        <span class=\"chip\" data-value=\"Materials Science\">Materials Science</span>\n        <span class=\"chip\" data-value=\"Neuroscience\">Neuroscience</span>\n        <span class=\"chip\" data-value=\"Quantum\">Quantum</span>\n        <span class=\"chip\" data-value=\"Robotics\">Robotics</span>\n        <span class=\"chip\" data-value=\"Semiconductors\">Semiconductors</span>\n        <span class=\"chip\" data-value=\"Space\">Space</span>\n      </div>\n      <div class=\"filter-row\" data-group=\"format\">\n        <span class=\"filter-label\">Series / Format</span>\n        <span class=\"chip\" data-value=\"What If?\">What If?</span>\n        <span class=\"chip\" data-value=\"Challenging Assumptions\">Challenging Assumptions</span>\n        <span class=\"chip\" data-value=\"Counterpoint\">Counterpoint</span>\n      </div>\n    </div>\n\n    <div class=\"rp-grid\" id=\"rp-grid\">\n      <div class=\"rp-card\" data-theme=\"Geopolitics\" data-topic=\"Quantum\" data-format=\"What If?\">\n        <div class=\"rp-thumb\" style=\"background-image:url('https://commons.wikimedia.org/wiki/Special:FilePath/Google_Sycamore_Chip_001.png?width=600');\">\n          <span class=\"rp-format\">What If?</span>\n        </div>\n        <h4>What If Sensing Outpaces Computing As Quantum's First Surprise?</h4>\n        <p>Commercial gravimetric sensors were built for mining. They may quietly erode decades of assumptions about what stays hidden underwater.</p>\n        <div class=\"rp-meta\"><div class=\"rp-tags\"><span>Quantum</span><span>Defense</span></div><span>12 min read</span></div>\n      </div>\n      <div class=\"rp-card\" data-theme=\"Economics\" data-topic=\"Materials Science\" data-format=\"Challenging Assumptions\">\n        <div class=\"rp-thumb\" style=\"background-image:url('https://commons.wikimedia.org/wiki/Special:FilePath/Silicon_wafer.jpg?width=600');\">\n          <span class=\"rp-format\">Challenging Assumptions</span>\n        </div>\n        <h4>The Chokepoint After The Chokepoint</h4>\n        <p>Every supply-chain fix relocates risk one stage downstream. Mineral processing, not mining, may be the real bottleneck nobody is tracking.</p>\n        <div class=\"rp-meta\"><div class=\"rp-tags\"><span>Materials</span><span>Trade</span></div><span>10 min read</span></div>\n      </div>\n      <div class=\"rp-card\" data-theme=\"Economics\" data-topic=\"AI\" data-format=\"Counterpoint\">\n        <div class=\"rp-thumb\" style=\"background-image:url('https://commons.wikimedia.org/wiki/Special:FilePath/Cern_datacenter.jpg?width=600');\">\n          <span class=\"rp-format\">Counterpoint</span>\n        </div>\n        <h4>Diffusion, Not Frontier Capability, Wins The AI Era</h4>\n        <p>A counterpoint to the \"whoever's first dominates everything\" thesis \u2014 durable advantage may live in adoption, not benchmark scores.</p>\n        <div class=\"rp-meta\"><div class=\"rp-tags\"><span>AI</span><span>Economics</span></div><span>14 min read</span></div>\n      </div>\n      <div class=\"rp-card\" data-theme=\"Geopolitics\" data-topic=\"Robotics\" data-format=\"What If?\">\n        <div class=\"rp-thumb\" style=\"background-image:url('https://commons.wikimedia.org/wiki/Special:FilePath/ROV_working_on_a_subsea_structure.jpg?width=600');\">\n          <span class=\"rp-format\">What If?</span>\n        </div>\n        <h4>What If The Ocean Became An Autonomous Ecosystem?</h4>\n        <p>Proliferating commercial underwater drones raise a quiet question: who owns maritime domain awareness when nobody does?</p>\n        <div class=\"rp-meta\"><div class=\"rp-tags\"><span>Robotics</span><span>Geopolitics</span></div><span>9 min read</span></div>\n      </div>\n      <div class=\"rp-card\" data-theme=\"Governance\" data-topic=\"Quantum\" data-format=\"Challenging Assumptions\">\n        <div class=\"rp-thumb\" style=\"background-image:url('https://commons.wikimedia.org/wiki/Special:FilePath/A_Wafer_of_the_Latest_D-Wave_Quantum_Computers_%2839188583425%29.jpg?width=600');\">\n          <span class=\"rp-format\">Challenging Assumptions</span>\n        </div>\n        <h4>Harvest Now, Decrypt Later \u2014 The Migration Nobody Finished</h4>\n        <p>Cryptographically relevant quantum computing doesn't need to arrive for the risk to already be live.</p>\n        <div class=\"rp-meta\"><div class=\"rp-tags\"><span>Cybersecurity</span><span>Finance</span></div><span>11 min read</span></div>\n      </div>\n      <div class=\"rp-card\" data-theme=\"Governance\" data-topic=\"AI\" data-format=\"Counterpoint\">\n        <div class=\"rp-thumb\" style=\"background-image:url('https://commons.wikimedia.org/wiki/Special:FilePath/Capitol_Building_Full_View.jpg?width=600');\">\n          <span class=\"rp-format\">Counterpoint</span>\n        </div>\n        <h4>Private Infrastructure Isn't Quietly Replacing The State</h4>\n        <p>A skeptical read on \"corporate sovereignty\" narratives \u2014 and where the evidence for state capacity actually holds up.</p>\n        <div class=\"rp-meta\"><div class=\"rp-tags\"><span>Governance</span><span>Policy</span></div><span>13 min read</span></div>\n      </div>\n    </div>\n    <p id=\"rp-empty\" style=\"display:none; color:var(--gray); font-size:14px; margin-top:8px;\">No research products match the selected filters. Try clearing a filter above.</p>\n    <a href=\"#\" class=\"learn-more\" style=\"display:inline-block; margin-top:8px;\">View all research products \u2192</a>\n\n    <div class=\"widget-row\">\n      <div class=\"predict-box\">\n        <h4>Prediction Check</h4>\n        <div class=\"q\">When will frontier AI models require national licensing in the U.S.?</div>\n        <div class=\"poll-row\">\n          <div class=\"poll-label\"><span>By 2026</span><span class=\"pct\">18%</span></div>\n          <div class=\"poll-track\"><div class=\"poll-fill\" style=\"width:18%\"></div></div>\n        </div>\n        <div class=\"poll-row\">\n          <div class=\"poll-label\"><span>2027\u20132028</span><span class=\"pct\">34%</span></div>\n          <div class=\"poll-track\"><div class=\"poll-fill\" style=\"width:34%\"></div></div>\n        </div>\n        <div class=\"poll-row\">\n          <div class=\"poll-label\"><span>2029\u20132030</span><span class=\"pct\">27%</span></div>\n          <div class=\"poll-track\"><div class=\"poll-fill\" style=\"width:27%\"></div></div>\n        </div>\n        <div class=\"poll-row\">\n          <div class=\"poll-label\"><span>After 2030</span><span class=\"pct\">13%</span></div>\n          <div class=\"poll-track\"><div class=\"poll-fill\" style=\"width:13%\"></div></div>\n        </div>\n        <div class=\"poll-row\">\n          <div class=\"poll-label\"><span>Never</span><span class=\"pct\">8%</span></div>\n          <div class=\"poll-track\"><div class=\"poll-fill\" style=\"width:8%\"></div></div>\n        </div>\n        <div class=\"poll-footer\"><span>2,847 votes</span><span>Updates daily</span></div>\n      </div>\n\n      <div class=\"whatif-box\">\n        <h4>Submit a \"What If...?\"</h4>\n        <div class=\"q\">Suggest a scenario for the Lab to explore. Selected prompts may inform future essays, events, or fellow responses.</div>\n        <textarea placeholder=\"What if...?\"></textarea>\n        <a href=\"#\" class=\"btn btn-red whatif-submit\">Submit \u2192</a>\n        <div class=\"whatif-footer\">1,204 scenarios submitted to date</div>\n      </div>\n    </div>\n  </div>\n</section>\n\n<!-- IMPACT -->\n<section class=\"section section-alt\">\n  <div class=\"wrap\">\n    <span class=\"eyebrow\">Impact</span>\n    <div class=\"section-head\" style=\"margin-bottom:0;\">\n      <p>The Tech Futures Lab's work reaches across three spheres of influence. We share scenario research with the public sector, including national security and intelligence agencies, and with the private sector, engaging directly with technology executives, investors, and boards. We convene public and private wargaming exercises, publish speculative and contrarian research, and partner with policymakers to translate emerging-technology signals into decision-ready analysis. <a href=\"#\" class=\"learn-more\">Learn more \u2192</a></p>\n    </div>\n  </div>\n</section>\n\n<!-- PEOPLE -->\n<section class=\"section\">\n  <div class=\"wrap\">\n    <span class=\"eyebrow\">People</span>\n    <div class=\"section-head\">\n      <h2>Our Fellows</h2>\n      <p>The Tech Futures Lab draws on senior scholars and next-generation researchers who bring rigorous, cross-disciplinary perspective to the technologies shaping our future.</p>\n    </div>\n    <div class=\"people-grid\">\n      <div>\n        <div class=\"person-photo p1\">AZ</div>\n        <div class=\"person-name\">Amy Zegart</div>\n        <div class=\"person-title\">Morris Arnold and Nona Jean Cox Senior Fellow</div>\n      </div>\n      <div>\n        <div class=\"person-photo p2\">ML</div>\n        <div class=\"person-name\">Maria Langan Riekhof</div>\n        <div class=\"person-title\">Distinguished Visiting Fellow</div>\n      </div>\n      <div>\n        <div class=\"person-photo p3\">HL</div>\n        <div class=\"person-name\">Herb Lin</div>\n        <div class=\"person-title\">Fellow</div>\n      </div>\n    </div>\n  </div>\n</section>\n\n<!-- EVENTS -->\n<section class=\"section section-alt\">\n  <div class=\"wrap\">\n    <span class=\"eyebrow\">Events</span>\n    <div class=\"section-head\">\n      <h2>Upcoming Events</h2>\n      <p>The Tech Futures Lab hosts wargaming exercises, roundtables, and public conversations throughout the year.</p>\n    </div>\n    <div>\n      <div class=\"event-row\">\n        <div class=\"event-date\"><span class=\"m\">MAY</span><span class=\"d\">15</span></div>\n        <div>\n          <div class=\"event-title\">The Future of AI Governance</div>\n          <div class=\"event-meta\">Panel Discussion \u00b7 12:00 PM PT \u00b7 Hoover Institution</div>\n        </div>\n      </div>\n      <div class=\"event-row\">\n        <div class=\"event-date\"><span class=\"m\">MAY</span><span class=\"d\">28</span></div>\n        <div>\n          <div class=\"event-title\">Biotech Frontiers and Society</div>\n          <div class=\"event-meta\">Research Workshop \u00b7 10:00 AM PT \u00b7 Stanford Campus</div>\n        </div>\n      </div>\n      <div class=\"event-row\">\n        <div class=\"event-date\"><span class=\"m\">JUN</span><span class=\"d\">10</span></div>\n        <div>\n          <div class=\"event-title\">Semiconductors and Economic Security</div>\n          <div class=\"event-meta\">Roundtable \u00b7 11:00 AM PT \u00b7 Hoover Institution</div>\n        </div>\n      </div>\n    </div>\n  </div>\n</section>\n\n<!-- CTA BAND -->\n<div class=\"cta-band\">\n  <div class=\"wrap\">\n    <h2>Join the Hoover Institution's community of supporters in ideas advancing freedom.</h2>\n    <a href=\"#\" class=\"btn btn-outline-white\">Support</a>\n  </div>\n</div>\n\n<!-- FOOTER -->\n<footer>\n  <div class=\"wrap footer-top\">\n    <div>\n      <div class=\"logo\">\n        <div class=\"logo-mark\">H</div>\n        <div class=\"logo-text\"><div class=\"l2\">Hoover Institution</div></div>\n      </div>\n      <p class=\"footer-blurb\">With its eminent scholars and world-renowned library and archives, the Hoover Institution seeks to improve the human condition by advancing ideas that promote economic opportunity and prosperity while securing and safeguarding peace for America and all mankind.</p>\n      <div class=\"social-row\">\n        <a href=\"#\">\ud835\udd4f</a><a href=\"#\">\u25b6</a><a href=\"#\">f</a><a href=\"#\">\u25ce</a>\n      </div>\n    </div>\n    <div class=\"footer-col\">\n      <h5>Key Site Sections</h5>\n      <a href=\"#\">About Hoover</a>\n      <a href=\"#\">Research</a>\n      <a href=\"#\">Commentary</a>\n      <a href=\"#\">Fellows</a>\n      <a href=\"#\">Library &amp; Archives</a>\n      <a href=\"#\">Support Hoover</a>\n    </div>\n    <div class=\"footer-col\">\n      <h5>Quick Links</h5>\n      <a href=\"#\">Student Opportunities</a>\n      <a href=\"#\">News</a>\n      <a href=\"#\">Events</a>\n      <a href=\"#\">Contact Us</a>\n      <a href=\"#\">Hoover Daily Report</a>\n    </div>\n    <div class=\"footer-col\">\n      <h5>Hoover Daily Report</h5>\n      <p style=\"font-size:12.5px; margin-bottom:14px;\">Subscribe for insights on the most pressing policy issues impacting you.</p>\n      <a href=\"#\" class=\"btn btn-outline-white\" style=\"padding:9px 16px; font-size:11.5px;\">Subscribe</a>\n    </div>\n  </div>\n  <div class=\"footer-bottom-inner\">\n    <div class=\"footer-bottom\">\n      <span>\u00a9 2026 by the Board of Trustees of Leland Stanford Junior University.</span>\n      <span>Privacy Policy \u00b7 Sitemap</span>\n    </div>\n  </div>\n</footer>\n\n<script>\n  (function(){\n    const state = { theme: null, topic: 'All', format: null };\n\n    function applyFilters(){\n      const cards = document.querySelectorAll('#rp-grid .rp-card');\n      let visibleCount = 0;\n      cards.forEach(function(card){\n        const matchesTheme = !state.theme || card.dataset.theme === state.theme;\n        const matchesTopic = state.topic === 'All' || card.dataset.topic === state.topic;\n        const matchesFormat = !state.format || card.dataset.format === state.format;\n        const show = matchesTheme && matchesTopic && matchesFormat;\n        card.style.display = show ? '' : 'none';\n        if (show) visibleCount++;\n      });\n      document.getElementById('rp-empty').style.display = visibleCount === 0 ? 'block' : 'none';\n    }\n\n    document.querySelectorAll('.filter-row').forEach(function(row){\n      const group = row.dataset.group;\n      const chips = row.querySelectorAll('.chip');\n\n      chips.forEach(function(chip){\n        chip.addEventListener('click', function(){\n          const value = chip.dataset.value;\n\n          if (group === 'topic') {\n            // \"All\" resets the topic facet; picking a specific topic deselects \"All\"\n            state.topic = value;\n            chips.forEach(function(c){ c.classList.toggle('active', c.dataset.value === value); });\n          } else {\n            // Themes and Format behave as single-select toggles: click again to clear\n            const isAlreadyActive = chip.classList.contains('active');\n            chips.forEach(function(c){ c.classList.remove('active'); });\n            if (isAlreadyActive) {\n              state[group] = null;\n            } else {\n              chip.classList.add('active');\n              state[group] = value;\n            }\n          }\n          applyFilters();\n        });\n      });\n    });\n\n    applyFilters();\n  })();\n<\/script>\n\n</body>\n</html>\n";
  const NAVY_HTML = "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>Tech Futures Lab</title>\n<style>\n:root {\n  --navy:#032342;\n  --navy-2:#07345f;\n  --cyan:#49d9ef;\n  --blue:#2678d9;\n  --ink:#102d50;\n  --muted:#60738d;\n  --line:#dce6ef;\n  --bg:#f5f8fb;\n  --gold:#b48a3b;\n  --maroon:#9E0B33;\n  --maroon-2:#7E082A;\n  --white:#fff;\n}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,\"Segoe UI\",sans-serif;line-height:1.4}\na{color:inherit;text-decoration:none}\nbutton,input,select{font:inherit}\n.page{width:100%;background:#fff}\n\n/* Header */\n.topbar{height:76px;padding:0 44px;background:#fff;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}\n.brand{display:flex;align-items:center;gap:20px}\n.brand img{display:block}\n.brand .hoover{width:172px}\n.hoover-nav{display:flex;gap:30px;align-items:center;font-size:14.5px;color:var(--ink);font-weight:500}\n.hoover-nav a:hover{color:var(--navy-2)}\n.topbar-right{display:flex;align-items:center;gap:22px}\n.icon-btn{width:19px;height:19px;color:var(--ink);cursor:pointer;flex-shrink:0}\n.myhoover{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--ink);cursor:pointer;white-space:nowrap}\n.support-btn{background:var(--maroon);color:#fff;padding:11px 20px;border-radius:100px;font-size:13.5px;font-weight:700;white-space:nowrap}\n.support-btn:hover{background:var(--maroon-2)}\n\n/* TFL sub-nav */\n.tfl-subnav{background:#fff;border-bottom:1px solid var(--line);position:relative;z-index:20}\n.tfl-subnav-inner{padding:0 44px;display:flex;align-items:center;gap:6px;height:58px}\n.tfl-item{position:relative}\n.tfl-item>a,.tfl-item>button{display:flex;align-items:center;gap:6px;padding:10px 16px;font-size:14px;font-weight:600;color:var(--ink);background:n div class=\"pillars-head\">\n    <h2>Six Ways Into the Lab's Work</h2>\n  </div>\n  <div class=\"pillars-grid\">\n\n    <a class=\"pillar\" href=\"mission.html\">\n      <div class=\"pillar-num\">01</div>\n      <h3>Mission</h3>\n      <p>Why the Lab exists, and the ways new technologies produce strategic surprise.</p>\n      <span class=\"pillar-link\">Learn more &#8594;</span>\n    </a>\n\n    <a class=\"pillar\" href=\"people.html\">\n      <div class=\"pillar-num\">02</div>\n      <h3>People</h3>\n      <p>The scholars, researchers, and fellows behind the Lab's foresight work.</p>\n      <span class=\"pillar-link\">Meet the team &#8594;</span>\n    </a>\n\n    <a class=\"pillar\" href=\"beyond-the-obvious.html\">\n      <div class=\"pillar-num\">03</div>\n      <h3>Beyond the Obvious</h3>\n      <p>Speculative essays, critical debates, alternative scenarios, podcasts, and monthly roundups.</p>\n      <span class=\"pillar-link\">Browse research &#8594;</span>\n    </a>\n\n    <a class=\"pillar\" href=\"emerging-signals.html\">\n      <div class=\"pillar-num\">04</div>\n      <h3>Emerging Signals</h3>\n      <p>A working view of where emerging technology may be headed next, and the signals worth watching along the way.</p>\n      <span class=\"pillar-link\">See the signals &#8594;</span>\n    </a>\n\n    <a class=\"pillar\" href=\"events.html\">\n      <div class=\"pillar-num\">05</div>\n      <h3>Events</h3>\n      <p>Wargaming exercises, roundtables, and public conversations, in person and online.</p>\n      <span class=\"pillar-link\">View calendar &#8594;</span>\n    </a>\n\n    <a class=\"pillar\" href=\"news.html\">\n      <div class=\"pillar-num\">06</div>\n      <h3>News</h3>\n      <p>Where the Lab's research and fellows are making an impact in the broader conversation.</p>\n      <span class=\"pillar-link\">Read coverage &#8594;</span>\n    </a>\n\n  </div>\n</section>\n<section class=\"newsletter\" id=\"subscribe\">\n  <div><h3>STAY UP TO DATE</h3><p>Get the latest research, events, and analysis from the Tech Futures Lab.</p></div>\n  <form class=\"signup\" onsubmit=\"event.preventDefault();alert('Thanks for subscribing to this mock-up.');\"><input type=\"email\" required placeholder=\"Enter your email address\"><button>Subscribe</button></form>\n</section>\n</div>\n<div class=\"tfl-page\" id=\"page-mission\" style=\"display:none\">\n<section class=\"subpage-hero\">\n  <div class=\"subpage-hero-inner\">\n    <div class=\"subpage-kicker\"></div>\n    <h1>Anticipating Strategic Technological Surprise</h1>\n    <p>The Tech Futures Lab's mission is to help the United States better anticipate potential strategic technological surprises and help it strengthen resilience through improved planning and risk management.</p>\n  </div>\n</section>\n\n<section class=\"subpage-body\">\n\n  <div class=\"mission-copy\">\n    <p>The many technological advances under way&mdash;from artificial intelligence and bioengineering to quantum technologies, energy innovations, and space capabilities&mdash;are accelerating the pace of change and introducing a new era of outsized possibilities and uncharted risks.</p>\n    <p>China's increased technological competencies and the rapid diffusion of capabilities across borders are compounding uncertainty and increasing the chance of Sputnik-like strategic shocks that could leave the U.S. at a disadvantage.</p>\n  </div>\n\n  <div class=\"surprise-wrap\">\n    <h2 class=\"section-title\">New technologies can produce strategic surprises in a variety of ways</h2>\n    <div class=\"surprise-grid\">\n      <div class=\"surprise-card\"><div class=\"icon\">&#9201;</div><h4>Pace of Emergence</h4><p>Capabilities arrive faster&mdash;or slower&mdash;than institutions are prepared for.</p></div>\n      <div class=\"surprise-card\"><div class=\"icon\">&#127919;</div><h4>Unintended Applications</h4><p>Tools built for one purpose get repurposed for another, without warning.</p></div>\n      <div class=\"surprise-card\"><div class=\"icon\">&#127760;</div><h4>Unlikely Adopters &amp; Winners</h4><p>Advantage doesn't always accrue to the actor everyone expected.</p></div>\n      <div class=\"surprise-card\"><div class=\"icon\">&#128260;</div><h4>Convergence of Technologies</h4><p>Two unremarkable capabilities combine into something nobody modeled.</p></div>\n      <div class=\"surprise-card\"><div class=\"icon\">&#128200;</div><h4>Secondary &amp; Tertiary Consequences</h4><p>The first-order effect is rarely the one that ends up mattering most.</p></div>\n    </div>\n  </div>\n\n  <div class=\"mission-copy\">\n    <p>The Tech Futures Lab conducts state-of-the-art foresight exercises with researchers, innovators, investors, and government leaders to draw out new insights, identify vulnerabilities and opportunities, and develop strategies to mitigate risk while maximizing advantages.</p>\n    <p>Its experiential learning opportunities include in-person scenario development and wargaming activities for participants from the private and public sectors. Working with experts at Stanford, the Lab also publishes speculative, alternative, and sometimes contrarian perspectives for how emerging technologies could transform our world in unplanned and unexpected ways. This effort is designed to complement the <a href=\"#\">Stanford Emerging Technology Review</a>.</p>\n  </div>\n\n  <div class=\"domain-wrap\">\n    <h2 class=\"section-title\">Technologies We Track</h2>\n    <div class=\"domain-icons\">\n      <div class=\"domain-icon\">Artificial Intelligence</div>\n      <div class=\"domain-icon\">Biotechnology</div>\n      <div class=\"domain-icon\">Crypto</div>\n      <div class=\"domain-icon\">Energy</div>\n      <div class=\"domain-icon\">Materials Science</div>\n      <div class=\"domain-icon\">Neuroscience</div>\n      <div class=\"domain-icon\">Quantum Technologies</div>\n      <div class=\"domain-icon\">Robotics</div>\n      <div class=\"domain-icon\">Semiconductors</div>\n      <div class=\"domain-icon\">Space</div>\n    </div>\n  </div>\n\n  <div class=\"mission-cta\">\n    <h3>Explore how we put this mission into practice</h3>\n    <div class=\"actions\">\n      <a href=\"beyond-the-obvious.html\" class=\"btn primary\">Browse Research &#8594;</a>\n      <a href=\"emerging-signals.html\" class=\"btn\" style=\"border-color:var(--navy);color:var(--navy)\">See Emerging Signals &#8594;</a>\n    </div>\n  </div>\n\n</section>\n</div>\n<div class=\"tfl-page\" id=\"page-people\" style=\"display:none\">\n<section class=\"subpage-hero\">\n  <div class=\"subpage-hero-inner\">\n    <div class=\"subpage-kicker\"></div>\n    <h1>People</h1>\n    <p>The scholars, researchers, and practitioners who bring the Tech Futures Lab's foresight work to life.</p>\n  </div>\n</section>\n\n<section class=\"subpage-body\">\n\n  <div class=\"people-section\">\n    <h2 class=\"section-title\">Leadership</h2>\n    <p class=\"people-sub\">Senior fellows guiding the Lab's research agenda and public engagement.</p>\n    <div class=\"people-grid\">\n      <div class=\"person\"><div class=\"initial\">AZ</div><strong>Amy Zegart</strong><span>Morris Arnold and Nona Jean Cox Senior Fellow</span></div>\n      <div class=\"person\"><div class=\"initial\">MLR</div><strong>Maria Langan Riekhof</strong><span>Distinguished Visiting Fellow</span></div>\n      <div class=\"person\"><div class=\"initial\">HL</div><strong>Herb Lin</strong><span>Fellow</span></div>\n    </div>\n  </div>\n\n  <div class=\"people-section\">\n    <h2 class=\"section-title\">Team</h2>\n    <p class=\"people-sub\">Researchers and staff supporting the Lab's day-to-day work. Roster forthcoming.</p>\n    <div class=\"people-grid\">\n      <div class=\"person\"><div class=\"initial\">LE</div><strong>Lisa Einstein</strong><span>Team</span></div>\n      <div class=\"person\"><div class=\"initial\">JO</div><strong>Jay Okey</strong><span>Team</span></div>\n      <div class=\"person\"><div class=\"initial\">EJ</div><s "subpage-hero\">\n  <div class=\"subpage-hero-inner\">\n    <div class=\"subpage-kicker\"></div>\n    <h1>Upcoming Events</h1>\n    <p>Wargaming exercises, roundtables, and public conversations hosted by the Tech Futures Lab.</p>\n  </div>\n</section>\n\n<div class=\"events-body\">\n  <div class=\"events-full\">\n    <div class=\"event\">\n      <div class=\"date\">MAY<b>15</b></div>\n      <div><strong>The Future of AI Governance</strong><small>Panel Discussion &middot; 12:00 PM PT &middot; Hoover Institution</small><a class=\"rsvp\" href=\"#\">RSVP &#8594;</a></div>\n    </div>\n    <div class=\"event\">\n      <div class=\"date\">MAY<b>28</b></div>\n      <div><strong>Biotech Frontiers and Society</strong><small>Research Workshop &middot; 9:00 AM PT &middot; Stanford Campus</small><a class=\"rsvp\" href=\"#\">RSVP &#8594;</a></div>\n    </div>\n    <div class=\"event\">\n      <div class=\"date\">JUN<b>10</b></div>\n      <div><strong>Semiconductors and Economic Security</strong><small>Roundtable &middot; 11:00 AM PT &middot; Hoover Institution</small><a class=\"rsvp\" href=\"#\">RSVP &#8594;</a></div>\n    </div>\n    <div class=\"event\">\n      <div class=\"date\">JUL<b>09</b></div>\n      <div><strong>Quantum Sensing and the End of Concealment</strong><small>Fireside Chat &middot; 1:00 PM PT &middot; Virtual</small><a class=\"rsvp\" href=\"#\">RSVP &#8594;</a></div>\n    </div>\n    <div class=\"event\">\n      <div class=\"date\">DEC<b>02</b></div>\n      <div><strong>Wargaming Strategic Surprise: A Tabletop Exercise</strong><small>Private Sector Workshop &middot; 9:00 AM PT &middot; Hoover Institution</small><a class=\"rsvp\" href=\"#\">RSVP &#8594;</a></div>\n    </div>\n  </div>\n</div>\n</div>\n<div class=\"tfl-page\" id=\"page-news\" style=\"display:none\">\n<section class=\"subpage-hero\">\n  <div class=\"subpage-hero-inner\">\n    <div class=\"subpage-kicker\"></div>\n    <h1>News &amp; Mentions</h1>\n    <p>Coverage of the Tech Futures Lab's research and fellows across major outlets.</p>\n  </div>\n</section>\n\n<div class=\"news-body\">\n  <div class=\"news-cards\">\n    <article class=\"card\">\n      <div class=\"kicker wsj\">WSJ OPINION</div>\n      <h3>A Realistic Path for AI Regulation</h3>\n      <p>An op-ed drawing on Lab research to argue for licensing regimes that scale with model capability rather than a blanket standard.</p>\n      <div class=\"tags\"><span class=\"tag\">AI</span><span class=\"tag\">Governance</span></div>\n      <div class=\"meta\">May 8, 2026 &middot; 2h ago</div>\n    </article>\n    <article class=\"card\">\n      <div class=\"kicker ft\">FINANCIAL TIMES</div>\n      <h3>Chips, Power, and the New Geopolitical Map</h3>\n      <p>Coverage citing the Lab's chokepoint research on how semiconductor supply chains are reshaping alliances.</p>\n      <div class=\"tags\"><span class=\"tag\">Semiconductors</span><span class=\"tag\">Geopolitics</span></div>\n      <div class=\"meta\">May 7, 2026 &middot; 1d ago</div>\n    </article>\n    <article class=\"card\">\n      <div class=\"kicker mit\">MIT TECHNOLOGY REVIEW</div>\n      <h3>Space Industry Poised for Industrial Scale</h3>\n      <p>A feature quoting Lab fellows on the commercialization curve facing the space sector over the next decade.</p>\n      <div class=\"tags\"><span class=\"tag\">Space</span><span class=\"tag\">Economics</span></div>\n      <div class=\"meta\">May 3, 2026 &middot; 5d ago</div>\n    </article>\n    <article class=\"card\">\n      <div class=\"kicker nyt\">THE NEW YORK TIMES</div>\n      <h3>Inside the Wargames Preparing the U.S. for Tech Shocks</h3>\n      <p>A profile of the Lab's scenario-development exercises and the public-private participants they bring together.</p>\n      <div class=\"tags\"><span class=\"tag\">Methodology</span><span class=\"tag\">Governance</span></div>\n      <div class=\"meta\">May 2, 2026 &middot; 6d ago</div>\n    </article>\n    <article class=\"card\">\n      <div class=\"kicke rship</a><a href=\"#\">Contact Us</a><a href=\"#\">Support Hoover</a></div>\n  <div><h4>RESEARCH</h4><a href=\"#\">All Research</a><a href=\"#\">Topics</a><a href=\"#\">Series & Formats</a><a href=\"#\">Publications</a></div>\n  <div><h4>PEOPLE</h4><a href=\"#\">Fellows</a><a href=\"#\">Affiliates</a><a href=\"#\">Student Programs</a><a href=\"#\">Careers</a></div>\n  <div><h4>EVENTS</h4><a href=\"#\">Upcoming Events</a><a href=\"#\">Past Events</a><a href=\"#\">Workshops</a><a href=\"#\">Webinars</a></div>\n  <div><h4>NEWS</h4><a href=\"#\">News & Commentary</a><a href=\"#\">In the Media</a><a href=\"#\">Press Releases</a><a href=\"#\">Hoover Digest</a></div>\n  <div class=\"copyright\">\u00a9 2026 The Board of Trustees of Leland Stanford Junior University.<br>All rights reserved.<br><br>Privacy Policy \u00b7 Terms of Use</div>\n</footer>\n</div>\n<script>\ndocument.querySelectorAll('.chip').forEach(chip => {\n  chip.addEventListener('click', () => {\n    chip.closest('.chips').querySelectorAll('.chip').forEach(c => c.classList.remove('active'));\n    chip.classList.add('active');\n  });\n});\n\n// TFL sub-nav dropdowns (click to open, click outside to close)\ndocument.querySelectorAll('.tfl-item').forEach(item => {\n  const trigger = item.querySelector(':scope > button');\n  if (!trigger) return;\n  trigger.addEventListener('click', (e) => {\n    e.stopPropagation();\n    const wasOpen = item.classList.contains('open');\n    document.querySelectorAll('.tfl-item.open').forEach(i => i.classList.remove('open'));\n    if (!wasOpen) item.classList.add('open');\n  });\n});\ndocument.addEventListener('click', () => {\n  document.querySelectorAll('.tfl-item.open').forEach(i => i.classList.remove('open'));\n});\n\n// Beyond the Obvious mega-menu: sort by Format / Domain / Theme\ndocument.querySelectorAll('.tfl-mega-tab').forEach(tab => {\n  tab.addEventListener('click', (e) => {\n    e.stopPropagation();\n    const mega = tab.closest('.tfl-mega');\n    mega.querySelectorAll('.tfl-mega-tab').forEach(t => t.classList.remove('active'));\n    mega.querySelectorAll('.tfl-mega-panel').forEach(p => p.classList.remove('active'));\n    tab.classList.add('active');\n    mega.querySelector(`.tfl-mega-panel[data-panel=\"${tab.dataset.tab}\"]`).classList.add('active');\n  });\n});\n\n/* ===== beyond-the-obvious page logic ===== */\nconst ITEMS = [\n  {title:\"What if Sensing Outpaces Computing?\", sub:\"Commercial gravimetric sensors were built for mining. They may quietly erode decades of assumptions about what stays hidden underwater.\", format:\"What If?\", domain:\"Quantum\", theme:\"Geopolitics\", date:\"2026-05-08\", read:\"12 min read\"},\n  {title:\"The Semiconductor Chokepoint\", sub:\"Assessing concentration risks and policy responses in the global chip supply chain.\", format:\"Critical Debates\", domain:\"Semiconductors\", theme:\"Geopolitics\", date:\"2026-05-06\", read:\"10 min read\"},\n  {title:\"What if Gene Editing Goes Mainstream?\", sub:\"Ethical, social, and regulatory implications of consumer biotechnology.\", format:\"What If?\", domain:\"Biotech\", theme:\"Governance\", date:\"2026-05-01\", read:\"14 min read\"},\n  {title:\"Crypto's Next Act: Beyond Speculation\", sub:\"An alternative scenario to the narrative that crypto lacks durable real-world utility.\", format:\"Alternative Scenarios\", domain:\"Crypto\", theme:\"Society\", date:\"2026-04-29\", read:\"9 min read\"},\n  {title:\"Robots at Work: Augmentation or Displacement?\", sub:\"Evidence and scenarios for the future of work across sectors.\", format:\"Critical Debates\", domain:\"Robotics\", theme:\"Education\", date:\"2026-04-24\", read:\"11 min read\"},\n  {title:\"What if Space Becomes an Industrial Frontier?\", sub:\"Opportunities and risks in the next era of space commercialization.\", format:\"What If?\", domain:\"Space\", theme:\"Geopolitics\", date:\"2026-04-22\", read:\"13 min read\"},\n  {title:\"Harvest Now, Decrypt Later\", sub:\"Cryptographically relevant quantum computing doesn't need to arrive for the risk to already be live.\", format:\"Critical Debates\", domain:\"Quantum\", theme:\"Governance\", date:\"2026-04-18\", read:\"11 min read\"},\n  {title:\"The Chokepoint After the Chokepoint\", sub:\"Every supply-chain fix relocates risk one stage downstream. Mineral processing may be the real bottleneck nobody is tracking.\", format:\"Critical Debates\", domain:\"Materials Science\", theme:\"Geopolitics\", date:\"2026-04-03\", read:\"10 min read\"},\n  {title:\"Diffusion, Not Frontier Capability, Wins the AI Era\", sub:\"An alternative scenario to the \\\"whoever's first dominates everything\\\" thesis.\", format:\"Alternative Scenarios\", domain:\"AI\", theme:\"Methodology\", date:\"2026-03-27\", read:\"14 min read\"},\n  {title:\"Private Infrastructure Isn't Quietly Replacing the State\", sub:\"A skeptical read on \\\"corporate sovereignty\\\" narratives, and where the evidence for state capacity actually holds up.\", format:\"Alternative Scenarios\", domain:\"AI\", theme:\"Governance\", date:\"2026-03-20\", read:\"13 min read\"},\n  {title:\"On the Record: Quantum Sensing and Strategic Surprise\", sub:\"A conversation on how commercial sensing capability is quietly reshaping concealment assumptions.\", format:\"Podcasts\", domain:\"Quantum\", theme:\"Methodology\", date:\"2026-03-14\", read:\"38 min listen\"},\n  {title:\"On the Record: Biotech's Regulatory Gap\", sub:\"A conversation on where consumer biotechnology has outpaced the frameworks meant to govern it.\", format:\"Podcasts\", domain:\"Biotech\", theme:\"Governance\", date:\"2026-02-28\", read:\"41 min listen\"},\n  {title:\"February Monthly: Signals Worth Watching\", sub:\"A roundup of the month's most consequential emerging-technology developments.\", format:\"Monthlies\", domain:\"AI\", theme:\"Methodology\", date:\"2026-02-03\", read:\"6 min read\"},\n  {title:\"January Monthly: Signals Worth Watching\", sub:\"A roundup of the month's most consequential emerging-technology developments.\", format:\"Monthlies\", domain:\"Energy\", theme:\"Society\", date:\"2026-01-06\", read:\"6 min read\"},\n  {title:\"What if the Ocean Became an Autonomous Ecosystem?\", sub:\"Proliferating commercial underwater drones raise a quiet question: who owns maritime domain awareness when nobody does?\", format:\"What If?\", domain:\"Robotics\", theme:\"Geopolitics\", date:\"2025-12-18\", read:\"9 min read\"},\n  {title:\"What if AI Learns to Deceive?\", sub:\"Exploring misalignment risks as models become more autonomous and goal-seeking.\", format:\"What If?\", domain:\"AI\", theme:\"Governance\", date:\"2025-12-02\", read:\"12 min read\"},\n];\n\nconst KICKER_CLASS = {\n  \"What If?\": \"gold\",\n  \"Critical Debates\": \"\",\n  \"Alternative Scenarios\": \"cyan\",\n  \"Podcasts\": \"maroon\",\n  \"Monthlies\": \"teal\",\n};\n\nfunction fmtDate(iso){\n  const d = new Date(iso + \"T00:00:00\");\n  return d.toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'});\n}\n\nconst state = { format: null, domain: null, theme: null };\n\nfunction applyFiltersFromQuery(qs){\n  state.format = null; state.domain = null; state.theme = null;\n  const params = new URLSearchParams(qs || '');\n  if (params.get('format')) state.format = params.get('format');\n  if (params.get('domain')) state.domain = params.get('domain');\n  if (params.get('theme')) state.theme = params.get('theme');\n}\n\nfunction render(){\n  const grid = document.getElementById('bto-grid');\n  const countEl = document.getElementById('bto-count');\n  const empty = document.getElementById('bto-empty');\n  let filtered = ITEMS.filter(it =>\n    (!state.format || it.format === state.format) &&\n    (!state.domain || it.domain === state.domain) &&\n    (!state.theme || it.theme === state.theme)\n  );\n  filtered = filtered.slice().sort((a,b) => b.date.localeCompare(a.date));\n\n  countEl.textContent = filtered.length + (filtered.length === 1 ? \" result\" : \" results\") + \", newest first\";\n  grid.innerHTML = '';\n  empty.style.display = filtered.length ? 'none' : 'block';\n\n  filtered.forEach(it => {\n    const card = document.createElement('article');\n    card.className = 'card';\n    const kClass = KICKER_CLASS[it.format] || '';\n    card.innerHTML = `\n      <div class=\"kicker ${kClass}\">${it.format.toUpperCase()}</div>\n      <h3>${it.title}</h3>\n      <p>${it.sub}</p>\n      <div class=\"tags\"><span class=\"tag\">${it.domain}</span><span class=\"tag\">${it.theme}</span></div>\n      <div class=\"meta\">${fmtDate(it.date)} &middot; ${it.read}</div>\n    `;\n    grid.appendChild(card);\n  });\n}\n\nfunction setupChips(){\n  document.querySelectorAll('.bto-chip[data-group]').forEach(chip => {\n    chip.addEventListener('click', () => {\n      const group = chip.dataset.group;\n      const value = chip.dataset.value;\n      const isAll = value === 'All';\n      const already = chip.classList.contains('active');\n      document.querySelectorAll(`.bto-chip[data-group=\"${group}\"]`).forEach(c => c.classList.remove('active'));\n      if (isAll || already) {\n        state[group] = null;\n        document.querySelector(`.bto-chip[data-group=\"${group}\"][data-value=\"All\"]`).classList.add('active');\n      } else {\n        state[group] = value;\n        chip.classList.add('active');\n      }\n      render();\n    });\n  });\n}\n\nfunction syncChipUI(){\n  ['format','domain','theme'].forEach(group => {\n    const val = state[group];\n    const sel = val\n      ? document.querySelector(`.bto-chip[data-group=\"${group}\"][data-value=\"${val}\"]`)\n      : document.querySelector(`.bto-chip[data-group=\"${group}\"][data-value=\"All\"]`);\n    document.querySelectorAll(`.bto-chip[data-group=\"${group}\"]`).forEach(c => c.classList.remove('active'));\n    if (sel) sel.classList.add('active');\n  });\n}\n\nfunction initBeyondPage(qs){\n  applyFiltersFromQuery(qs);\n  syncChipUI();\n  render();\n}\nsetupChips();\ninitBeyondPage('');\n\n/* ---- Single-page router: swaps visible page sections instead of real navigation ---- */\nconst FILE_TO_KEY = {\n  'tech_futures_lab_navy.html': 'home',\n  'mission.html': 'mission',\n  'people.html': 'people',\n  'beyond-the-obvious.html': 'beyond',\n  'emerging-signals.html': 'signals',\n  'events.html': 'events',\n  'news.html': 'news',\n};\nconst PAGE_KEYS = Object.values(FILE_TO_KEY);\n\nfunction showPage(key, queryString){\n  PAGE_KEYS.forEach(k => {\n    const el = document.getElementById('page-' + k);\n    if (el) el.style.display = (k === key) ? '' : 'none';\n  });\n  document.querySelectorAll('.tfl-subnav-inner > .tfl-item > a[href]').forEach(a => {\n    const hrefPath = a.getAttribute('href').split('?')[0];\n    a.classList.toggle('current', FILE_TO_KEY[hrefPath] === key);\n  });\n  document.querySelector('.page').scrollTop = 0;\n  window.scrollTo(0, 0);\n  if (key === 'beyond' && typeof initBeyondPage === 'function') {\n    initBeyondPage(queryString || '');\n  }\n}\n\ndocument.addEventListener('click', function(e){\n  const a = e.target.closest('a[href]');\n  if (!a) return;\n  const hrefFull = a.getAttribute('href');\n  if (!hrefFull) return;\n  const qIdx = hrefFull.indexOf('?');\n  const hrefPath = qIdx === -1 ? hrefFull : hrefFull.slice(0, qIdx);\n  const hrefQuery = qIdx === -1 ? '' : hrefFull.slice(qIdx);\n  if (Object.prototype.hasOwnProperty.call(FILE_TO_KEY, hrefPath)) {\n    e.preventDefault();\n    document.querySelectorAll('.tfl-item.open').forEach(i => i.classList.remove('open'));\n    showPage(FILE_TO_KEY[hrefPath], hrefQuery);\n  }\n});\n\nshowPage('home', '');\n\n<\/script>\n</body>\n</html>\n";

    Object.keys(frames).forEach(function(key){
      frames[key].style.display = (key === which) ? 'block' : 'none';
      buttons[key].classList.remove('active-a', 'active-b', 'active-c');
      if (key === which) buttons[key].classList.add(activeClass[key]);
    });
  }

  btnFuturistic.addEventListener('click', function(){ show('futuristic'); });
  btnHoover.addEventListener('click', function(){ show('hoover'); });
  btnNavy.addEventListener('click', function(){ show('navy'); });

  show('futuristic');
</script>
